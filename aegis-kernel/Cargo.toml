[package]
name = "aegis-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[features]
kernel = []
# Phase 4 conformance: emit a replayable capability trace (C:lines) to COM1 at
# the syscall dispatch choke point. Off by default; the shipped image carries
# no trace state and no extra output.
trace = []
# Phase I: build this kernel image as node A or node B of a two-instance
# fleet demo. Mutually exclusive — pick exactly one per build, never both.
fleet-node-a = []
fleet-node-b = []
# Phase J-3: run the mesh demo (two-node consensus + remote invocation of a
# transferred capability) instead of the Phase I transport demo. Combined
# with exactly one of fleet-node-a / fleet-node-b.
fleet-j3 = []

[dependencies]

[[bin]]
name = "aegis-kernel"
path = "src/main.rs"
required-features = ["kernel"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
