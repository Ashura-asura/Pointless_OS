[package]
name = "aegis-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[features]
kernel = []
# Real-hardware milestone 1 (serial canary): the canary build compiles the
# storage write path OUT entirely — no NVMe probe, no FAT ESP read, no
# object store, no editor/browser seeding, no system-update. What is left
# proves boot on physical silicon with zero disk writes: UEFI loader -> GOP
# display -> scheduler -> desktop. The network demo is NOT gated: it is
# write-free and self-skips when no e1000e is present.
canary = []
# Phase 4 conformance: emit a replayable capability trace (C:lines) to COM1 at
# the syscall dispatch choke point. Off by default; the shipped image carries
# no trace state and no extra output.
trace = []
# Phase I: build this kernel image as node A or node B of a two-instance
# fleet demo. Mutually exclusive — pick exactly one per build, never both.
fleet-node-a = []
fleet-node-b = []
# Phase J-3: run the mesh demo (two-node consensus + remote invocation of a
# transferred capability) instead of the Phase I transport demo. Combined
# with exactly one of fleet-node-a / fleet-node-b.
fleet-j3 = []
# Phase L: run the chaos-testing harness (randomized task-crash,
# network-partition, resource-exhaustion fault injection against the real
# supervisor/fleet/frame-allocator) as part of boot. Off by default —
# normal fleet/CI/vmx images compile zero chaos code. See chaos.rs module
# docs for the fail-open definition each scenario checks.
chaos-demo = []
# Phase K: wire the VT-x (VMX) bring-up demo into the END of boot. Off by
# default — normal fleet/CI images compile zero VMX code. When enabled the
# guarded call runs last (after every demo spawned and the desktop shown,
# before interrupts turn on): on a CPU without VT-x it is a harmless no-op
# that falls through to the idle loop, and on a VMX-capable CPU it launches
# the real-mode guest and halts after the first real VM-exit (single round
# trip, no vmresume yet — that halt is the demo's intended terminal state).
vmx-demo = []

[dependencies]

[[bin]]
name = "aegis-kernel"
path = "src/main.rs"
required-features = ["kernel"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
