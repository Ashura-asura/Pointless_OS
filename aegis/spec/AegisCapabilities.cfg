\*  Model configuration — the checked instance.
\*  All invariants are universal claims; TLC proves them for this finite instance
\*  (standard model-checking honesty: the strength of the guarantee is the size of
\*  the search, documented here so it can be argued with).
\*  Size budget: 2 tasks (Root + the adversary Eve), 3 slots, 2 mint budget after
\*  boot (boot mints 4: root self, creator, grant root, eve self). Request shapes are
\*  the maximal request, grant-only, control-only and the empty request - clamping is
\*  monotone in the request, so these four bound all shapes. Expiries are {never, 5}
\*  against a clock horizon of 12 (Tick only shifts now by 5, so I5 is exercised at
\*  the 5-expiry frame and never-expiry is the persistent frame; now <= Horizon also
\*  makes the search structurally terminating).
CONSTANTS
  Tasks      = {"Root", "Eve"}
  Slots      = {0, 1, 2}
  RIGHTS     = {"R", "W", "C", "S", "RCV", "G", "RECEIVE"}
  Root       = "Root"
  Eve        = "Eve"
  Creator    = "CreatorObj"
  GrantRoot  = "GrantRootObj"
  MaxMints   = 6
  INF        = 500
  Horizon    = 12

SPECIFICATION Spec
INVARIANT InvAll