\*  Model configuration for AegisCeiling — the checked instance.
\*  Size budget kept small deliberately for a first run: 3 roles (fixed by
\*  the spec's own ASSUME), bounds of 3 for each numeric scope dimension.
\*  Scopes as a full record type gives TLC a finite-but-nontrivial search
\*  space (2 * 4 * 4 * 4 * 3 = 384 possible scope values per role, 3 roles
\*  => the reachable-state search is bounded by narrowing chains through
\*  that space, not by these constants alone). Raise MaxPages/MaxHandles/
\*  MaxSlice for a stronger (larger) checked instance once a first run's
\*  real state count is in hand — cite whatever TLC actually reports, not
\*  this comment's arithmetic, which is a sizing estimate, not a result.
CONSTANTS
  Roles      = {"RestartService", "ObserveService", "QueryAdvisor"}
  MaxPages   = 3
  MaxHandles = 3
  MaxSlice   = 3

SPECIFICATION Spec
INVARIANT InvAll
