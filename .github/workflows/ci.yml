name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (library + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aegis-kernel/target
            uefi-boot/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Build library
        run: cargo build -p aegis-kernel
      - name: Run tests
        run: cargo test -p aegis-kernel

  build-kernel:
    name: build kernel + uefi bootloader (freestanding targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - name: Build kernel ELF (freestanding)
        run: cargo build --release --features kernel --bin aegis-kernel --target x86_64-unknown-none -p aegis-kernel
      - name: Build UEFI bootloader
        run: cargo build --release --features uefi --target x86_64-unknown-uefi -p uefi-boot

  lint:
    name: cargo clippy (warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (aegis-kernel lib)
        run: cargo clippy -p aegis-kernel --all-targets -- -D warnings
