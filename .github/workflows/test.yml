name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aegis/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aegis/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Delete lockfile
        run: rm -f Cargo.lock

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace