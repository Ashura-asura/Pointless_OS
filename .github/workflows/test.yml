name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aegis/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aegis/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Delete lockfile
        run: rm -f Cargo.lock

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  kernel:
    name: Kernel + Bootloader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Kernel fmt
        run: cargo fmt --check
        working-directory: aegis-kernel

      - name: Kernel clippy
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: -Dwarnings
        working-directory: aegis-kernel

      - name: Kernel test
        run: |
          rm -f Cargo.lock
          cargo test
        working-directory: aegis-kernel

      - name: Install kernel target
        run: rustup target add x86_64-unknown-none

      - name: Kernel release build (x86_64-unknown-none)
        run: cargo build --release --target x86_64-unknown-none --features kernel
        working-directory: aegis-kernel

      - name: Bootloader fmt
        run: cargo fmt --check
        working-directory: uefi-boot

      - name: Bootloader clippy
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: -Dwarnings
        working-directory: uefi-boot

      - name: Bootloader test
        run: |
          rm -f Cargo.lock
          cargo test
        working-directory: uefi-boot

      - name: Install bootloader target
        run: rustup target add x86_64-unknown-uefi

      - name: Bootloader release build (x86_64-unknown-uefi)
        run: cargo build --release --target x86_64-unknown-uefi --features uefi
        working-directory: uefi-boot