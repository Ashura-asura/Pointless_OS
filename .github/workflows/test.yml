name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly growth of the committed fuzz corpus (Phase AE).
    - cron: '23 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aegis/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aegis/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Delete lockfile
        run: rm -f Cargo.lock

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Reachable-authority audit (build-breaking gate, design doc §10 [CLOSED] TCB creep)
        run: cargo run -p capability-audit

  kernel:
    name: Kernel + Bootloader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Kernel fmt
        run: cargo fmt --check
        working-directory: aegis-kernel

      - name: Kernel clippy
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: -Dwarnings
        working-directory: aegis-kernel

      - name: Kernel test
        run: |
          rm -f Cargo.lock
          cargo test
        working-directory: aegis-kernel

      - name: Install kernel target
        run: rustup target add x86_64-unknown-none

      - name: Kernel release build (x86_64-unknown-none)
        run: cargo build --release --target x86_64-unknown-none --features kernel
        working-directory: aegis-kernel

      - name: Bootloader fmt
        run: cargo fmt --check
        working-directory: uefi-boot

      - name: Bootloader clippy
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: -Dwarnings
        working-directory: uefi-boot

      - name: Bootloader test
        run: |
          rm -f Cargo.lock
          cargo test
        working-directory: uefi-boot

      - name: Install bootloader target
        run: rustup target add x86_64-unknown-uefi

      - name: Bootloader release build (x86_64-unknown-uefi)
        run: cargo build --release --target x86_64-unknown-uefi --features uefi
        working-directory: uefi-boot

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    # The root rust-toolchain.toml pins 1.97.1 (stable); override it here so
    # the installed nightly + cargo-miri is actually used.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # Tests that touch wall-clock time / host calls (e.g. capability-audit's
      # audit_fixtures calls SystemTime::now -> clock_gettime) must not abort
      # Miri. Disable isolation so those host calls succeed; UB detection
      # (memory/races) stays fully active.
      MIRIFLAGS: -Zmiri-disable-isolation
    defaults:
      run:
        working-directory: aegis
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - name: Model workspace under Miri
        run: cargo miri test --workspace

      - name: Kernel host-testable modules under Miri
        working-directory: aegis-kernel
        run: |
          for m in boot_info:: channel:: e1000:: ept:: frame:: ipc:: policy_engine:: hardening_fuzz:: hardening_syscalls::; do
            echo "=== $m ==="
            cargo miri test "$m" || exit 1
          done

  asan:
    name: ASan (address sanitizer)
    runs-on: ubuntu-latest
    # The root rust-toolchain.toml pins 1.97.1 (stable); override it here so
    # -Zsanitizer=address is accepted by the compiler.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # Kernel-style code intentionally never frees global structures; at
      # process exit LeakSanitizer would otherwise flag them. Keep real
      # address-safety checks (overflow/UAF) but ignore exit-time leaks.
      ASAN_OPTIONS: detect_leaks=0
    defaults:
      run:
        working-directory: aegis
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Model workspace under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test --workspace

      - name: Kernel under ASan
        working-directory: aegis-kernel
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo test

  fuzz-nightly:
    name: Fuzz corpus growth (nightly)
    # Phase AE: a long, coverage-broadening fuzz pass that grows the committed
    # corpus. Runs nightly ONLY (gated by `schedule` below) so the corpus
    # evolves in git history without thrashing the repo on every push. The
    # push CI gate is the bounded `corpus_driven_fuzz_is_total_and_grows` run
    # inside the kernel `test` job above.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can commit + push the grown corpus cleanly.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Grow corpus (release budget) + commit
        working-directory: aegis-kernel
        env:
          AEGIS_FUZZ_GROW: "1"
          AEGIS_FUZZ_ITERS: "1000000"
        run: |
          rm -f Cargo.lock
          cargo test --release fuzz_corpus::corpus_driven_fuzz_is_total_and_grows
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fuzz-corpus
          # Only commit if the corpus actually grew.
          if ! git diff --cached --quiet; then
            git commit -m "chore(fuzz): grow committed corpus [nightly]"
            git push
          else
            echo "corpus unchanged; nothing to commit"
          fi

  soak:
    name: Soak (10x chaos / combined subsystems)
    # Phase AF: a bounded, continuous chaos/soak pass over the combined model
    # subsystems (capability-core, orchestration policy+grants+supervision,
    # supervision-tree, fleet, resources, capability-audit). Runs nightly ONLY
    # so the 10x-density invariant battery is exercised continuously without
    # slowing per-push CI. The per-push gate is the `soak_smoke_bounded` test
    # inside `cargo test --workspace` (Test + Lint job).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Soak run (bounded, release)
        run: |
          rm -f Cargo.lock
          cargo run -p soak --release -- --duration 600 --seed 0x50A50A0A

  fuzz-push:
    name: Fuzz bounded gate (push)
    # Phase AE: a bounded, few-minute fuzz pass on every push/PR so the
    # total-no-panic property is continuously enforced. The corpus harness is
    # read-only here (no growth) — growth happens in the nightly job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Kernel fuzz gate (read-only corpus, bounded budget)
        working-directory: aegis-kernel
        run: |
          rm -f Cargo.lock
          cargo test --release fuzz_corpus::corpus_driven_fuzz_is_total_and_grows

  summary:
    name: Emit test-summary.json
    # Prevents the documentation's test totals from drifting: CI computes the
    # authoritative per-suite counts and publishes them as an artifact. Self-
    # contained (re-runs the three suites) so it cannot break the Test/Kernel
    # gate jobs above.
    runs-on: ubuntu-latest
    needs: [test, kernel]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Install kernel/bootloader targets
        run: rustup target add x86_64-unknown-none x86_64-unknown-uefi

      - name: Emit test-summary.json
        run: bash scripts/emit-test-summary.sh

      - name: Upload test-summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.json
